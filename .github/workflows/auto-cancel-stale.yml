name: Auto Cancel Stale Workflows

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Cancel stale queued and in-progress workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const cutoffMs = 30 * 60 * 1000;
            const now = Date.now();
            const currentRunId = context.runId;

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            );

            for (const run of runs) {
              if (run.id === currentRunId) continue;
              if (!['queued', 'in_progress'].includes(run.status)) continue;

              const ageMs = now - new Date(run.created_at).getTime();
              if (ageMs <= cutoffMs) continue;

              core.info(`Cancelling stale run ${run.id} (${run.name}) created at ${run.created_at}`);
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
              } catch (error) {
                core.warning(`Could not cancel run ${run.id}: ${error.message}`);
              }
            }
