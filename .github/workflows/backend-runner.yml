name: Ephemeral Backend Engine

on:
  repository_dispatch:
    types: [start-backend, trigger-task]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ephemeral-backend-${{ github.event.client_payload.task_id || github.run_id }}
  cancel-in-progress: true

jobs:
  backend-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_BOT_NAME: ${{ secrets.TELEGRAM_BOT_NAME }}
      TELEGRAM_BOT_LINKS: ${{ secrets.TELEGRAM_BOT_LINKS }}
      BACKEND_RUN_TIMEOUT_SECONDS: 600
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      NGROK_API_KEY: ${{ secrets.NGROK_API_KEY }}
      NGROK_STATIC_URL: https://lahoma-scenographical-inconveniently.ngrok-free.dev
      NGROK_STATUS_CONTEXT: ephemeral-backend-url
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Install Ngrok CLI
        run: npm install --global ngrok

      - name: Configure Ngrok with stored authtoken
        run: ngrok config add-authtoken "$NGROK_AUTHTOKEN"

      - name: Report backend boot event
        run: node scripts/telegram-notifier.js
        continue-on-error: true

      - name: Start static Ngrok tunnel and backend
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            status=$?
            if [[ -n "${BACKEND_PID:-}" ]] && kill -0 "$BACKEND_PID" 2>/dev/null; then
              kill -TERM "$BACKEND_PID" 2>/dev/null || true
              for _ in {1..10}; do
                kill -0 "$BACKEND_PID" 2>/dev/null || break
                sleep 1
              done
              kill -KILL "$BACKEND_PID" 2>/dev/null || true
              wait "$BACKEND_PID" 2>/dev/null || true
            fi
            if [[ -n "${NGROK_PID:-}" ]] && kill -0 "$NGROK_PID" 2>/dev/null; then
              kill -TERM "$NGROK_PID" 2>/dev/null || true
              wait "$NGROK_PID" 2>/dev/null || true
            fi
            exit "$status"
          }
          trap cleanup EXIT INT TERM

          ngrok http 8080 --url https://lahoma-scenographical-inconveniently.ngrok-free.dev > /tmp/ngrok.log 2>&1 &
          NGROK_PID=$!
          echo "Static Ngrok tunnel started with PID $NGROK_PID"

          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:4040/api/tunnels >/dev/null 2>&1; then break; fi
            if ! kill -0 "$NGROK_PID" 2>/dev/null; then
              echo "::error::Ngrok process exited unexpectedly."
              cat /tmp/ngrok.log || true
              exit 1
            fi
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:4040/api/tunnels >/dev/null 2>&1; then
            echo "::error::Ngrok local API did not become ready."
            cat /tmp/ngrok.log || true
            exit 1
          fi

          node backend/server.js &
          BACKEND_PID=$!
          echo "Ephemeral backend started with PID $BACKEND_PID"

          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then break; fi
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
              echo "::error::Backend process exited before /health became ready."
              exit 1
            fi
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
            echo "::error::Backend health endpoint did not become ready."
            exit 1
          fi

          echo "Inspecting active Ngrok tunnels through the REST API..."
          API_TUNNELS=""
          if [[ -n "${NGROK_API_KEY:-}" ]]; then
            API_TUNNELS="$(curl -fsS -H "Authorization: Bearer $NGROK_API_KEY" -H "Accept: application/json" https://api.ngrok.com/tunnels || true)"
          else
            echo "::warning::NGROK_API_KEY is empty; REST API monitoring is unavailable."
          fi

          STATIC_API_ACTIVE=false
          if [[ -n "$API_TUNNELS" ]] && python3 -c 'import json,sys; d=json.loads(sys.stdin.read()); raise SystemExit(0 if any(t.get("public_url") == "https://lahoma-scenographical-inconveniently.ngrok-free.dev" for t in d.get("tunnels",[])) else 1)' <<<"$API_TUNNELS" 2>/dev/null; then
            STATIC_API_ACTIVE=true
            echo "Ngrok REST API confirms the static domain is active."
          fi

          DOMAIN_HEALTH=false
          if curl -fsS --max-time 10 "$NGROK_STATIC_URL/health" >/tmp/ngrok-health.json 2>/dev/null; then
            DOMAIN_HEALTH=true
            echo "Static domain health check passed: $NGROK_STATIC_URL/health"
          fi

          if [[ "$STATIC_API_ACTIVE" != true || "$DOMAIN_HEALTH" != true ]]; then
            echo "::warning::Static tunnel/API health check failed; restarting Ngrok tunnel automatically."
            kill -TERM "$NGROK_PID" 2>/dev/null || true
            wait "$NGROK_PID" 2>/dev/null || true
            ngrok http 8080 --url https://lahoma-scenographical-inconveniently.ngrok-free.dev > /tmp/ngrok.log 2>&1 &
            NGROK_PID=$!
            for _ in {1..30}; do
              if curl -fsS http://127.0.0.1:4040/api/tunnels >/dev/null 2>&1; then break; fi
              if ! kill -0 "$NGROK_PID" 2>/dev/null; then break; fi
              sleep 1
            done
            if [[ -n "${NGROK_API_KEY:-}" ]]; then
              API_TUNNELS="$(curl -fsS -H "Authorization: Bearer $NGROK_API_KEY" -H "Accept: application/json" https://api.ngrok.com/tunnels || true)"
            fi
            if curl -fsS --max-time 10 "$NGROK_STATIC_URL/health" >/tmp/ngrok-health.json 2>/dev/null; then
              DOMAIN_HEALTH=true
              echo "Static domain recovered after automatic Ngrok restart."
            fi
          fi

          FALLBACK_NGROK_URL=""
          if [[ -n "$API_TUNNELS" ]]; then
            FALLBACK_NGROK_URL="$(python3 -c 'import json,sys; d=json.loads(sys.stdin.read()); print(next((t.get("public_url","") for t in d.get("tunnels",[]) if t.get("public_url")), ""))' <<<"$API_TUNNELS" 2>/dev/null || true)"
            [[ -n "$FALLBACK_NGROK_URL" ]] && echo "Ngrok API active tunnel URI: $FALLBACK_NGROK_URL"
          fi

          if [[ "$DOMAIN_HEALTH" != true ]]; then
            if [[ -n "$FALLBACK_NGROK_URL" ]]; then
              echo "::warning::Static domain remains unhealthy; using API-reported fallback tunnel URI: $FALLBACK_NGROK_URL"
              export NGROK_URL="$FALLBACK_NGROK_URL"
            else
              echo "::error::No healthy static domain and no active fallback tunnel URI reported by Ngrok API."
              cat /tmp/ngrok.log || true
              exit 1
            fi
          else
            export NGROK_URL="$NGROK_STATIC_URL"
          fi
          echo "NGROK_URL=$NGROK_URL" >> "$GITHUB_ENV"
          echo "NGROK_URL=$NGROK_URL" >> "$GITHUB_ENV"
          echo "Static Ngrok URL: $NGROK_URL"

          STATUS_PAYLOAD="$(python3 -c 'import json,os; print(json.dumps({"state":"success","target_url":os.environ["NGROK_STATIC_URL"],"description":"Static Ngrok backend is online","context":os.environ["NGROK_STATUS_CONTEXT"]}))')"
          curl -fsS -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"             -d "$STATUS_PAYLOAD"

          echo "Static backend published at $NGROK_URL"
          timeout --signal=TERM --kill-after=10s "${BACKEND_RUN_TIMEOUT_SECONDS}s" tail --pid="$BACKEND_PID" -f /dev/null

      - name: Graceful cleanup
        if: always()
        shell: bash
        run: |
          echo "Static Ngrok/backend cleanup completed."
