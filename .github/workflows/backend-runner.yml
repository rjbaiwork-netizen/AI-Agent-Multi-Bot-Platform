name: Ephemeral Backend Engine

on:
  repository_dispatch:
    types: [start-backend, trigger-task]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ephemeral-backend-${{ github.event.client_payload.task_id || github.run_id }}
  cancel-in-progress: true

jobs:
  backend-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_BOT_NAME: ${{ secrets.TELEGRAM_BOT_NAME }}
      TELEGRAM_BOT_LINKS: ${{ secrets.TELEGRAM_BOT_LINKS }}
      BACKEND_RUN_TIMEOUT_SECONDS: 600
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      NGROK_STATUS_CONTEXT: ephemeral-backend-url
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Report backend boot event
        run: node scripts/telegram-notifier.js
        continue-on-error: true

      - name: Start ephemeral backend
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            status=$?
            if [[ -n "${BACKEND_PID:-}" ]] && kill -0 "$BACKEND_PID" 2>/dev/null; then
              kill -TERM "$BACKEND_PID" 2>/dev/null || true
              for _ in {1..10}; do
                kill -0 "$BACKEND_PID" 2>/dev/null || break
                sleep 1
              done
              kill -KILL "$BACKEND_PID" 2>/dev/null || true
              wait "$BACKEND_PID" 2>/dev/null || true
            fi
            exit "$status"
          }
          trap cleanup EXIT INT TERM

          node backend/server.js &
          BACKEND_PID=$!

          echo "Ephemeral backend started with PID $BACKEND_PID"
          NGROK_URL=""
          for _ in {1..60}; do
            NGROK_URL="$(curl -fsS http://127.0.0.1:4040/api/tunnels 2>/dev/null | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((t.get("public_url","") for t in data.get("tunnels",[]) if t.get("public_url","")), ""))' 2>/dev/null || true)"
            if [[ "$NGROK_URL" == https://* ]]; then break; fi
            sleep 1
          done
          if [[ "$NGROK_URL" != https://* ]]; then
            echo "::error::Ngrok tunnel URL was not available from http://127.0.0.1:4040/api/tunnels"
            exit 1
          fi
          export NGROK_URL
          echo "NGROK_URL=$NGROK_URL" >> "$GITHUB_ENV"
          echo "Ngrok URL captured: $NGROK_URL"
          STATUS_PAYLOAD="$(python3 -c 'import json,os; print(json.dumps({"state":"success","target_url":os.environ["NGROK_URL"],"description":"Ephemeral backend is online","context":os.environ["NGROK_STATUS_CONTEXT"]}))')"
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$STATUS_PAYLOAD"
          echo "Ephemeral backend published at $NGROK_URL"
          timeout --signal=TERM --kill-after=10s "${BACKEND_RUN_TIMEOUT_SECONDS}s" tail --pid="$BACKEND_PID" -f /dev/null

      - name: Graceful cleanup
        if: always()
        shell: bash
        run: |
          echo "Phase 1 ephemeral backend cleanup completed."
